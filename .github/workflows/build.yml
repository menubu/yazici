name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/MenuBuPrinterAgent.csproj

    - name: Build
      run: dotnet build src/MenuBuPrinterAgent.csproj --configuration Release --no-restore

    - name: Publish
      run: |
        dotnet publish src/MenuBuPrinterAgent.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:EnableCompressionInSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          --output ./publish/win-x64

    - name: Create ZIP
      run: |
        Compress-Archive -Path ./publish/win-x64/* -DestinationPath MenuBuPrinterAgent-win64.zip

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Build Setup EXE
      run: |
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\MenuBuPrinterAgent.iss

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MenuBuPrinterAgent-win64
        path: |
          MenuBuPrinterAgent-win64.zip
          dist/MenuBuPrinterAgent-Setup.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          MenuBuPrinterAgent-win64.zip
          dist/MenuBuPrinterAgent-Setup.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
